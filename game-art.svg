    <path d="M-10 150 C40 140 90 162 150 150 S240 138 290 150 S330 160 340 156"/>
    <path d="M-10 186 C30 176 100 198 160 186 S250 174 300 186 S330 192 340 190"/>
    <path d="M-10 218 C50 208 110 230 170 218 S260 206 340 220"/>
  </g>

  <!-- 물웅덩이 -->
  <path d="M196 74 C222 60 276 64 300 82 C318 96 300 116 268 116 C236 118 214 112 200 102 C188 94 186 82 196 74Z" fill="url(#pool)" opacity=".9"/>
