    <path d="M-30 6 C-30 -16 30 -16 30 6 C30 20 -30 20 -30 6Z" fill="#D2412F"/>
    <path d="M-18 -4 C-10 -10 4 -10 12 -6" fill="none" stroke="#F08A74" stroke-width="3" stroke-linecap="round" opacity=".7"/>
